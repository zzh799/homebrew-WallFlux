name: Sync Cask

# 定时检查 WallFlux 主仓库的最新 Release，版本变化时自动更新本 tap 的 cask 文件。
# 不使用 PAT：本 workflow 用 GITHUB_TOKEN 写自己的仓库即可，主仓库公开可读。

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync cask from latest release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sync cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # 读取主仓库最新 Release 版本（去掉 v 前缀）
          LATEST="$(gh api repos/zzh799/WallFlux/releases/latest --jq '.tag_name' | sed 's/^v//')"
          echo "Latest release: $LATEST"

          # 读取当前 cask 版本
          CURRENT="$(sed -n 's/^  version "\([^"]*\)"/\1/p' Casks/wallflux.rb)"
          echo "Current cask version: $CURRENT"

          if [ "$LATEST" = "$CURRENT" ]; then
            echo "已是最新版本，无需更新"
            exit 0
          fi

          # 下载 DMG 计算 sha256
          URL="https://github.com/zzh799/WallFlux/releases/download/v${LATEST}/WallFlux-${LATEST}.dmg"
          echo "Downloading $URL"
          curl -fsSL -o /tmp/wallflux.dmg "$URL"
          SHA="$(shasum -a 256 /tmp/wallflux.dmg | awk '{print $1}')"
          echo "sha256: $SHA"

          # 更新 cask 文件
          sed -i "s/^  version \"[^\"]*\"/  version \"$LATEST\"/; s/^  sha256 \"[^\"]*\"/  sha256 \"$SHA\"/" Casks/wallflux.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/wallflux.rb
          git commit -m "更新 wallflux cask 至 v${LATEST}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/zzh799/homebrew-WallFlux.git" HEAD:main
